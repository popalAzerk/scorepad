<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>Score Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#12141c; --panel:#1b1e29; --panel2:#232735; --line:#2f3546;
  --txt:#eef1f8; --dim:#9aa3b8; --accent:#f5b31c; --accent2:#ffd45e;
  --win:#3ddc84; --empty:#6f7a92; --btn:#20180a; --radius:16px;
}
body.clair{
  --bg:#f7f7fb; --panel:#ffffff; --panel2:#eef0f6; --line:#dde1ec;
  --txt:#161a22; --dim:#5d677d; --win:#0f7a3d; --empty:#7b8598; --btn:#20180a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%,var(--panel2) 0%,var(--bg) 60%);
  color:var(--txt); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header .sub{font-size:12px;color:var(--dim);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--btn);border-color:#c99612}
.btn.ghost{background:transparent}
.btn.danger{color:#ff6b6b;border-color:#4a2b32}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{flex:1;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--dim);font-size:13px}
.banner{background:#4a2b32;color:#ffd9d9;border-radius:12px;padding:10px 12px;font-size:13px}
.hidden{display:none!important}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:16px;outline:none}
input:focus-visible,.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-size:12px;color:var(--dim);display:block;margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.6px}
.game{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);width:100%;text-align:left}
.game .meta{flex:1;min-width:0}
.game .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .x{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--dim);border-radius:12px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:0 0 auto;background:var(--panel2)}
.gridwrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center;font-size:14px}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
thead th .pill{font-size:10px;color:var(--dim);display:block;font-weight:600}
tbody th{padding:6px 10px;color:var(--dim);font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
td.cell{min-width:64px}
td.cell button{display:block;width:100%;min-height:44px;padding:12px 6px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
td.cell button.empty{color:var(--empty);font-weight:600}
tfoot td,tfoot th{background:var(--panel2);font-weight:800;font-size:16px;padding:12px 6px;border-top:1px solid var(--line)}
tfoot th{position:sticky;left:0;background:var(--panel2);color:var(--txt)}
.tot.win{color:var(--win)}
.sheet{position:fixed;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:flex-end;z-index:50;backdrop-filter:blur(3px)}
.sheet .inner{width:100%;max-width:820px;margin:0 auto;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .who{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sheet .who .name{font-weight:800;font-size:17px}
.disp{font-size:40px;font-weight:800;text-align:center;padding:6px 0 12px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 0;font-size:20px;font-weight:700;min-height:56px}
.keys button.soft{color:#ff6b6b}
.keys button.wide{grid-column:span 3;background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--btn);border-color:#c99612}
.keys button.warn{background:#5a3a12;color:#ffe2a8;border-color:#8a5c1c}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:10px;min-height:16px}
.hint.alerte{color:#ffb4b4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px}
.chip button{min-width:36px;min-height:36px;display:grid;place-items:center;color:var(--dim)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:13px 8px;font-size:14px;font-weight:600;color:var(--dim);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--btn)}
.empty-state{text-align:center;color:var(--dim);padding:26px 10px}
footer{padding:10px 16px 18px;text-align:center;color:var(--dim);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header>
  <h1>Score&nbsp;Pad<span class="sub" id="hdrSub"></span></h1>
  <button class="btn ghost" id="btnTheme" aria-label="Basculer le thème clair ou sombre" title="Thème">◐</button>
</header>
<main id="app"></main>
<footer>Vos parties restent sur cet appareil · aucune inscription</footer>
<div id="sheetHost"></div>
<div id="banner" class="sr" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================================
   Score Pad — compteur de points (HTML+CSS+JS autonome, données locales).
   Modèle : {version:1, theme:'sombre'|'clair', games:[Game]}
   Game   : {id, nom, mode:'standard'|'sommeNulle', gagne:'haut'|'bas',
             joueurs:[{id,nom,emoji}], tours:[[number|null,...]], maj:number}
   ========================================================================== */
const K='scorepad.v1', KT='scorepad.theme', KB='scorepad.v1.bak', KBS='scorepad.v1.bak.ts';
const ID_RE=/^[a-z0-9]{1,16}$/;
const EMOJIS=['🙂','😀','🦊','🐻','🐼','🦁','🐸','🐵','🐧','🦄','🚀','⭐','🎲','🃏','🏆','🍀'];
const MONTANT_MAX=999999.99;
const MONT_RE=/^-?\d{0,6}(\.\d{0,2})?$/;

let data={version:1, games:[]};
let vue={ecran:'liste', id:'', saisie:null, form:null, focus:null, alerte:''};

/* --------------------------------- outils --------------------------------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ const v=Number(n); if(!Number.isFinite(v)) return '—';
  return (Math.round(v*100)/100).toLocaleString('fr-FR'); }
function bandeau(msg){ const b=document.getElementById('banner'); b.textContent=msg; b.className=msg?'banner':'sr';
  if(msg){ clearTimeout(bandeau._t); bandeau._t=setTimeout(()=>{b.textContent='';b.className='sr';}, 6000); } }

/* ------------------------------ persistance ------------------------------- */
function normaliser(brut){
  const out={version:1, games:[]}; let modifie=false; const vus=new Set();
  if(!brut || typeof brut!=='object' || !Array.isArray(brut.games)){ return {out, modifie:true}; }
  for(const g of brut.games){
    if(!g||typeof g!=='object'){ modifie=true; continue; }
    let id=(typeof g.id==='string'&&ID_RE.test(g.id))?g.id:uid();
    if(vus.has(id)){ id=uid(); modifie=true; }
    vus.add(id);
    if(id!==g.id) modifie=true;
    const nom=(typeof g.nom==='string'&&g.nom.trim())?g.nom.slice(0,60):'Partie sans nom';
    if(nom!==g.nom) modifie=true;
    const mode=(g.mode==='sommeNulle')?'sommeNulle':'standard';
    const gagne=(g.gagne==='bas')?'bas':'haut';
    if(!Array.isArray(g.joueurs)||!g.joueurs.length){ modifie=true; continue; }
    const joueurs=g.joueurs.map((j,i)=>{
      const jn=(j&&typeof j.nom==='string'&&j.nom.trim())?j.nom.slice(0,24):'Joueur '+(i+1);
      const emo=(j&&typeof j.emoji==='string'&&j.emoji.length<=4)?j.emoji:EMOJIS[i%EMOJIS.length];
      const jid=(j&&typeof j.id==='string'&&ID_RE.test(j.id))?j.id:uid();
      if(jn!==(j&&j.nom)||emo!==(j&&j.emoji)||jid!==(j&&j.id)) modifie=true;
      return {id:jid, nom:jn, emoji:emo};
    });
    let tours=Array.isArray(g.tours)?g.tours:[];
    tours=tours.map(t=>{
      const ligne=Array.isArray(t)?t:[];
      const recalee=joueurs.map((_,j)=>{ const v=ligne[j];
        const n=Number(v);
        return (v===null||v===undefined||v===''||!Number.isFinite(n))
          ? null
          : Math.round(Math.max(-MONTANT_MAX,Math.min(MONTANT_MAX,n))*100)/100 || 0; });
      if(!Array.isArray(t)||recalee.some((v,i)=>v!==t[i])) modifie=true;
      return recalee;
    });
    out.games.push({id, nom, mode, gagne, joueurs, tours, maj:Number.isFinite(Number(g.maj))?Number(g.maj):Date.now()});
  }
  return {out, modifie};
}
function sauvegarderOriginal(texte){
  try{
    if(localStorage.getItem(KBS)) return;            // on n'écrase pas une sauvegarde existante
    localStorage.setItem(KB, texte);
    localStorage.setItem(KBS, String(Date.now()));
  }catch(e){}
}
function load(){
  let brut=null, texte=null;
  try{ texte=localStorage.getItem(K); brut=texte?JSON.parse(texte):null; }
  catch(e){ bandeau('Données illisibles : une sauvegarde a été conservée, la session repart à vide.'); }
  const {out, modifie}=normaliser(brut);
  if(texte && (modifie || brut===null)) sauvegarderOriginal(texte);
  data=out;
  let theme='sombre';
  try{ theme=localStorage.getItem(KT)==='clair'?'clair':'sombre'; }catch(e){}
  document.body.classList.toggle('clair', theme==='clair');
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = theme==='clair'?'#f7f7fb':'#12141c';
  return data;
}
function save(){
  try{ localStorage.setItem(K, JSON.stringify(data)); return true; }
  catch(e){ bandeau('Sauvegarde impossible : stockage plein ou bloqué. Vos scores restent affichés mais seront perdus au rechargement.'); return false; }
}

/* -------------------------------- requêtes -------------------------------- */
function jeu(){ return data.games.find(g=>g.id===vue.id); }
function total(g,j){ return Math.round(g.tours.reduce((s,t)=>s+(Number(t[j])||0),0)*100)/100; }
function totaux(g){ return g.joueurs.map((_,j)=>total(g,j)); }
function aDesScores(g){ return g.tours.some(t=>t.some(v=>v!==null&&v!==undefined)); }
function aMarque(g,j){ return g.tours.some(t=>t[j]!==null&&t[j]!==undefined); }
function gagnant(g){
  if(!g.joueurs.length||!aDesScores(g)) return {index:-1, egalite:false, aucun:true, indices:[]};
  const t=totaux(g), max=g.gagne!=='bas';
  const candidats=t.map((v,i)=>aMarque(g,i)?i:-1).filter(i=>i>=0);   // un joueur sans score ne gagne pas
  if(!candidats.length) return {index:-1, egalite:false, aucun:true, indices:[]};
  const vals=candidats.map(i=>t[i]);
  const best=max?Math.max(...vals):Math.min(...vals);
  const indices=candidats.filter(i=>t[i]===best);
  return {index:indices[0], egalite:indices.length>1, aucun:false, indices};
}

/* --------------------------------- rendu ---------------------------------- */
function render(){
  const app=document.getElementById('app');
  const g=vue.ecran==='jeu'?jeu():null;
  document.getElementById('hdrSub').textContent = g? ' · '+g.nom : '';
  const scroll=app.querySelector('.gridwrap');
  const sc=scroll?{l:scroll.scrollLeft,t:scroll.scrollTop}:null;
  app.innerHTML = vue.ecran==='liste'? vueListe() : vue.ecran==='nouvelle'? vueNouvelle() : vueJeu();
  if(vue.saisie){ const g2=jeu(); if(!g2||!ligneValide(g2,vue.saisie.t)||!g2.joueurs[vue.saisie.j]) fermerFeuille(false); }
  brancher();
  const apres=app.querySelector('.gridwrap');
  if(sc&&apres){ apres.scrollLeft=sc.l; apres.scrollTop=sc.t; }
  if(vue.focus){ const el=app.querySelector(vue.focus)||document.querySelector(vue.focus); if(el) el.focus({preventScroll:true}); vue.focus=null; }
}
function vueListe(){
  const gs=[...data.games].sort((a,b)=>b.maj-a.maj);
  return `<div class="row between">
    <div class="muted">${gs.length} partie${gs.length>1?'s':''} enregistrée${gs.length>1?'s':''}</div>
    <button class="btn primary" data-act="nouvelle" data-focus="nouvelle">+ Nouvelle partie</button>
  </div>
  ${gs.length? gs.map(g=>{
    const w=gagnant(g), t=totaux(g);
    const sousTitre=`${g.joueurs.length} joueurs · ${g.tours.filter(x=>x.some(v=>v!==null)).length} tour(s)`
      +(w.aucun?'':w.egalite?' · égalité : '+w.indices.map(i=>esc(g.joueurs[i].nom)).join(', ')
                        :' · 🏆 '+esc(g.joueurs[w.index].nom)+' '+fmt(t[w.index]));
    return `<div class="game">
      <span class="avatar" aria-hidden="true">🎲</span>
      <button class="meta" data-open="${esc(g.id)}" data-focus="open-${esc(g.id)}">
        <span class="title">${esc(g.nom)}</span>
        <span class="muted" style="display:block">${sousTitre}</span>
      </button>
      <button class="x" data-del="${esc(g.id)}" aria-label="Supprimer la partie ${esc(g.nom)}">✕</button>
    </div>`;}).join('')
    : `<div class="card empty-state">Aucune partie pour l'instant.<br>Créez-en une : un nom, des joueurs, et c'est parti.</div>`}`;
}
function vueNouvelle(){
  const st=vue.form;
  return `<div class="card">
    <label for="fNom">Nom de la partie</label>
    <input type="text" id="fNom" maxlength="60" placeholder="Rummy du vendredi" value="${esc(st.nom)}" autocomplete="off">
  </div>
  <div class="card">
    <label>Joueurs (${st.joueurs.length})</label>
    <div class="chips">${st.joueurs.map((j,i)=>`<span class="chip"><span aria-hidden="true">${esc(j.emoji)}</span>${esc(j.nom)}
      <button data-delj="${i}" aria-label="Retirer ${esc(j.nom)}">✕</button></span>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="fJoueur" maxlength="24" placeholder="Prénom du joueur" style="flex:1" value="${esc(st.joueur)}" autocomplete="off">
      <button class="btn" data-act="addj">Ajouter</button>
    </div>
  </div>
  <div class="card">
    <label>Mode de calcul</label>
    <div class="seg" role="group" aria-label="Mode de calcul">
      <button data-mode="standard" aria-pressed="${st.mode==='standard'}">Standard</button>
      <button data-mode="sommeNulle" aria-pressed="${st.mode==='sommeNulle'}">Somme nulle</button>
    </div>
    <div class="muted" style="margin:10px 2px 0">${st.mode==='sommeNulle'
      ? 'Chaque tour doit totaliser zéro (Tarot, contrats). Les points se répartissent entre les joueurs.'
      : 'Chaque joueur marque ses points librement.'}</div>
  </div>
  <div class="card">
    <label>La victoire revient au score</label>
    <div class="seg" role="group" aria-label="Condition de victoire">
      <button data-gagne="haut" aria-pressed="${st.gagne==='haut'}">Le plus haut</button>
      <button data-gagne="bas" aria-pressed="${st.gagne==='bas'}">Le plus bas</button>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn ghost" data-act="retour">Annuler</button>
    <button class="btn primary" data-act="creer" style="flex:1">Créer la partie</button>
  </div>`;
}
function vueJeu(){
  const g=jeu(); if(!g){ vue.ecran='liste'; return vueListe(); }
  const t=totaux(g), w=gagnant(g);
  const entete=`<caption class="sr">Scores par tour et par joueur</caption>
   <thead><tr><th scope="col">Tour</th>${g.joueurs.map(j=>`<th scope="col">${esc(j.emoji)}<span class="pill">${esc(j.nom)}</span></th>`).join('')}</tr></thead>`;
  const corps=g.tours.map((tour,ti)=>`<tr><th scope="row">${ti+1}</th>${g.joueurs.map((_,ji)=>{
    const v=tour[ji], vide=(v===null||v===undefined);
    return `<td class="cell"><button class="${vide?'empty':''}" data-cell="${ti}:${ji}"
      aria-label="Tour ${ti+1}, ${esc(g.joueurs[ji].nom)} : ${vide?'aucun score':fmt(v)}">${vide?'·':fmt(v)}</button></td>`;}).join('')}</tr>`).join('');
  const pied=`<tfoot><tr><th scope="row">Total</th>${t.map((v,i)=>`<td class="tot ${(!w.aucun&&w.indices.includes(i))?'win':''}">${fmt(v)}</td>`).join('')}</tr></tfoot>`;
  return `<div class="row between">
    <button class="btn ghost" data-act="retour">‹ Parties</button>
    <button class="btn ghost" data-act="export">Exporter</button>
  </div>
  <div class="gridwrap"><table>${entete}<tbody>${corps}</tbody>${pied}</table></div>
  ${g.tours.length?'':`<div class="card empty-state">Aucun tour. Ajoutez-en un pour commencer à marquer.</div>`}
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <button class="btn primary" data-act="addtour" style="flex:1;min-width:180px">+ Ajouter un tour</button>
    <button class="btn danger" data-act="delder" ${g.tours.length?'':'disabled'}>Annuler le dernier tour</button>
  </div>
  <div class="muted">Appuyez sur une case pour saisir ou corriger un score. Victoire au score le ${g.gagne==='bas'?'plus bas':'plus haut'} · mode ${g.mode==='sommeNulle'?'somme nulle':'standard'}.${w.egalite?' <strong>Égalité : '+w.indices.map(i=>esc(g.joueurs[i].nom)).join(', ')+'.</strong>':''}</div>`;
}
function ligneValide(g,t){ return !!(g && Array.isArray(g.tours) && g.tours[t]); }
function feuilleSaisie(){
  const s=vue.saisie; if(!s) return '';
  const g=jeu();
  if(!g || !ligneValide(g,s.t) || !g.joueurs[s.j]){ return ''; }
  const j=g.joueurs[s.j];
  const alerte=(g.mode==='sommeNulle'&&s.etape===1);
  return `<div class="sheet" data-sheet="1"><div class="inner" role="dialog" aria-modal="true" aria-label="Saisie du score" tabindex="-1">
    <div class="who"><span class="name">${esc(j.emoji)} ${esc(j.nom)}</span><span class="muted">Tour ${s.t+1}</span></div>
    <div class="disp" id="sDisp" role="status" aria-live="polite" aria-label="Valeur saisie">${esc(s.val===''||s.val==='-'?'—':s.val)}</div>
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}
      <button data-key="±" aria-label="Changer le signe">±</button><button data-key="0">0</button>
      <button data-key="←" aria-label="Effacer le dernier chiffre">←</button>
      <button class="soft" data-key="vide">Effacer</button>
      <button data-key=".">.</button>
      <button class="wide ${alerte?'warn':''}" id="sOk" data-key="ok">${alerte?'Total ≠ 0 — valider quand même':'Valider'}</button>
    </div>
    <div class="hint ${alerte?'alerte':''}" id="sHint">${esc(texteIndice(g,s))}</div>
  </div></div>`;
}
function texteIndice(g,s){
  if(s.msg) return s.msg;
  if(g.mode==='sommeNulle'){
    const ligne=g.tours[s.t]||[];
    const somme=ligne.reduce((a,x)=>a+(Number(x)||0),0)
      - (Number(ligne[s.j])||0) + (Number(s.val)||0);
    const reste=Math.round((-somme)*100)/100;
    return 'Somme nulle · reste à répartir : '+fmt(reste)
      +(reste===0?' (tour équilibré)':'');
  }
  return 'Case vide puis Valider : le score est effacé. Montant négatif avec ±';
}
/* ---- la feuille est mise à jour SUR PLACE : le focus et les annonces restent stables ---- */
function majFeuille(){
  const s=vue.saisie; if(!s) return;
  const g=jeu(); if(!g) return;
  const d=document.getElementById('sDisp'), h=document.getElementById('sHint'), ok=document.getElementById('sOk');
  if(d) d.textContent = (s.val===''||s.val==='-'?'—':s.val);
  if(h){ h.textContent=texteIndice(g,s); h.className='hint '+(s.etape===1?'alerte':''); }
  if(ok){ const al=(g.mode==='sommeNulle'&&s.etape===1);
    ok.textContent = al?'Total ≠ 0 — valider quand même':'Valider';
    ok.className = 'wide '+(al?'warn':''); }
}
function ouvrirFeuille(){
  const host=document.getElementById('sheetHost');
  host.innerHTML=feuilleSaisie();
  document.getElementById('app').inert=true;
  host.querySelector('.inner')?.focus({preventScroll:true});
  host.onclick=(e)=>{
    if(e.target.dataset.sheet){ fermerFeuille(); return; }
    const b=e.target.closest('[data-key]'); if(b) touche(b.dataset.key);
  };
  document.removeEventListener('keydown', touchesClavier);
  document.addEventListener('keydown', touchesClavier);
}
function touchesClavier(e){
  if(!vue.saisie) return;
  if(e.key==='Escape'){ e.preventDefault(); fermerFeuille(); return; }
  if(e.key==='Entrée'||e.key==='Enter'){ e.preventDefault(); touche('ok'); return; }
  if(e.key==='Retour arrière'||e.key==='Backspace'){ e.preventDefault(); touche('←'); return; }
  if(e.key===','||e.key==='.'){ e.preventDefault(); touche('.'); return; }
  if(e.key==='-'){ e.preventDefault(); touche('±'); return; }
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); touche(e.key); }
}
function fermerFeuille(rendreFocus=true){
  document.getElementById('sheetHost').innerHTML='';
  document.getElementById('app').inert=false;
  document.removeEventListener('keydown', touchesClavier);
  const s=vue.saisie; vue.saisie=null;
  document.getElementById('sheetHost').onclick=null;
  if(rendreFocus && s){ vue.focus='[data-cell="'+s.t+':'+s.j+'"]'; render(); }
}
/* ---- frappe : limites sans perte de signe, deux décimales au plus ---- */
function chiffresSaisis(val){ return (val||'').replace('-','').replace('.','').length; }
function decimalesSaisies(val){ const i=(val||'').indexOf('.'); return i<0?0:(val.length-i-1); }
function touche(k){
  const s=vue.saisie; if(!s) return;
  if(k==='ok'){ validerSaisie(); return; }
  // toute autre touche annule l'étape « valider quand même » : le contrôle doit se refaire
  s.etape=0; s.msg='';
  if(k==='vide'){ s.val=''; s.frais=false; }
  else if(k==='←'){ s.val=s.val.slice(0,-1); s.frais=false; }
  else if(k==='±'){ s.val=s.val.startsWith('-')? s.val.slice(1) : '-'+(s.val||'0'); s.frais=false; }
  else if(k==='.'){ if(decimalesSaisies(s.val)===0 && !s.val.includes('.')){ s.val=(s.val||'0')+'.'; s.frais=false; } }
  else {
    if(s.frais){ s.val=''; s.frais=false; }
    if(decimalesSaisies(s.val)>=2 || chiffresSaisis(s.val)>=6){ majFeuille(); return; }  // on refuse la touche, on ne tronque pas
    s.val=(s.val==='0'?'':s.val)+k;
  }
  majFeuille();
}
function validerSaisie(){
  const s=vue.saisie, g=jeu(); if(!s||!g) return;
  if(!ligneValide(g,s.t) || !g.joueurs[s.j]){ fermerFeuille(false); return; }   // tour supprimé entre-temps
  const brut=(s.val||'').trim();
  const ancien=g.tours[s.t][s.j];
  if(brut===''||brut==='-'){                    // case vidée volontairement
    g.tours[s.t][s.j]=null; g.maj=Date.now(); save(); fermerFeuille(); return;
  }
  if(!MONT_RE.test(brut)){
    s.msg='Montant invalide : six chiffres au plus, un point et deux décimales.'; majFeuille(); return;
  }
  let v=Number(brut);
  if(!Number.isFinite(v)){ s.msg='Montant invalide.'; majFeuille(); return; }
  v=Math.round(Math.max(-MONTANT_MAX, Math.min(MONTANT_MAX, v))*100)/100;
  if(Object.is(v,-0)) v=0;
  g.tours[s.t][s.j]=v;
  if(g.mode==='sommeNulle'){
    const somme=Math.round(g.tours[s.t].reduce((a,x)=>a+(Number(x)||0),0)*100)/100;
    const complet=g.tours[s.t].every(x=>x!==null);
    if(complet && Math.abs(somme)>0.001 && s.etape<1){
      g.tours[s.t][s.j]=ancien;               // rien n'est écrit tant que ce n'est pas confirmé
      s.etape=1; s.msg='Ce tour totalise '+fmt(somme)+' au lieu de 0. Appuyez de nouveau sur Valider pour confirmer.';
      majFeuille(); return;
    }
  }
  g.maj=Date.now(); save(); fermerFeuille();
}

function brancher(){
  const app=document.getElementById('app'), q=x=>app.querySelector(x);
  q('[data-act="nouvelle"]')?.addEventListener('click',()=>{
    vue={ecran:'nouvelle', id:'', saisie:null, form:{nom:'', joueur:'', mode:'standard', gagne:'haut', joueurs:[]},
         focus:'#fNom', alerte:''};
    render();});
  app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{
    vue={ecran:'jeu', id:b.dataset.open, saisie:null, form:null, focus:'[data-act="addtour"]', alerte:''};
    render();}));
  app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const g=data.games.find(x=>x.id===b.dataset.del);
    if(g&&confirm('Supprimer définitivement la partie « '+g.nom+' » ?')){
      data.games=data.games.filter(x=>x.id!==g.id); save();
      vue={ecran:'liste', id:'', saisie:null, form:null, focus:'[data-act="nouvelle"]', alerte:''}; render();}}));
  q('[data-act="retour"]')?.addEventListener('click',()=>{
    if(vue.saisie) fermerFeuille(false);
    vue={ecran:'liste', id:'', saisie:null, form:null, focus:'[data-act="nouvelle"]', alerte:''}; render();});
  q('#fNom')?.addEventListener('input',e=>{ vue.form.nom=e.target.value; });
  q('#fJoueur')?.addEventListener('input',e=>{ vue.form.joueur=e.target.value; });
  q('[data-act="addj"]')?.addEventListener('click',()=>{
    const i=q('#fJoueur'), nom=(i.value||'').trim();
    if(!nom){ i.focus(); return; }
    const n=vue.form.joueurs.length;
    vue.form.joueurs.push({id:uid(), nom, emoji:EMOJIS[n%EMOJIS.length]});
    vue.form.joueur=''; vue.focus='#fJoueur'; render();});
  q('#fJoueur')?.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); q('[data-act="addj"]').click(); }});
  app.querySelectorAll('[data-delj]').forEach(b=>b.addEventListener('click',()=>{
    vue.form.joueurs.splice(+b.dataset.delj,1); vue.focus='#fJoueur'; render();}));
  app.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{
    vue.form.mode=b.dataset.mode; vue.focus='[data-mode="'+b.dataset.mode+'"]'; render();}));
  app.querySelectorAll('[data-gagne]').forEach(b=>b.addEventListener('click',()=>{
    vue.form.gagne=b.dataset.gagne; vue.focus='[data-gagne="'+b.dataset.gagne+'"]'; render();}));
  q('[data-act="creer"]')?.addEventListener('click',()=>{
    const nom=(q('#fNom')?.value||'').trim()||'Partie sans nom';
    if(vue.form.joueurs.length<2){ bandeau('Il faut au moins deux joueurs pour compter les points.'); return; }
    const g={id:uid(), nom, mode:vue.form.mode, gagne:vue.form.gagne,
             joueurs:vue.form.joueurs.slice(), tours:[vue.form.joueurs.map(()=>null)], maj:Date.now()};
    data.games.push(g); save();
    vue={ecran:'jeu', id:g.id, saisie:null, form:null, alerte:'', focus:'[data-cell="0:0"]'}; render();});
  q('[data-act="addtour"]')?.addEventListener('click',()=>{
    const g=jeu(); if(!g) return;
    g.tours.push(g.joueurs.map(()=>null)); g.maj=Date.now(); save();
    vue.focus='[data-cell="'+(g.tours.length-1)+':0"]'; render();});
  q('[data-act="delder"]')?.addEventListener('click',()=>{
    const g=jeu(); if(!g||!g.tours.length) return;
    if(confirm('Supprimer le dernier tour et ses scores ?')){
      g.tours.pop(); g.maj=Date.now(); save(); vue.focus='[data-act="addtour"]'; render(); }});
  q('[data-act="export"]')?.addEventListener('click',()=>exporter(jeu()));
  app.querySelectorAll('[data-cell]').forEach(b=>b.addEventListener('click',()=>{
    const g=jeu(); if(!g) return;
    const [t,j]=b.dataset.cell.split(':').map(Number);
    if(!ligneValide(g,t)||!g.joueurs[j]) return;
    const v=g.tours[t][j], plein=(v!==null&&v!==undefined);
    vue.saisie={t, j, val:plein?String(v):'', frais:plein, etape:0, msg:''};
    ouvrirFeuille();}));
}
/* --------------------------------- export -------------------------------- */
async function exporter(g){
  if(!g) return;
  const t=totaux(g), w=gagnant(g);
  let txt='Score Pad — '+g.nom+'\n';
  txt+='Victoire au score le '+(g.gagne==='bas'?'plus bas':'plus haut')+' · '+(g.mode==='sommeNulle'?'somme nulle':'standard')+'\n\n';
  txt+='Tour\t'+g.joueurs.map(j=>j.nom).join('\t')+'\n';
  g.tours.forEach((tr,i)=>{ txt+=(i+1)+'\t'+g.joueurs.map((_,j)=>tr[j]===null?'-':fmt(tr[j])).join('\t')+'\n'; });
  txt+='TOTAL\t'+t.map(fmt).join('\t')+'\n';
  if(!w.aucun){ txt+='\n'+(w.egalite?'Égalité : ':'🏆 ')+w.indices.map(i=>g.joueurs[i].nom+' ('+fmt(t[i])+')').join(', ')+'\n'; }
  if(navigator.share){
    try{ await navigator.share({title:g.nom, text:txt}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  try{
    await navigator.clipboard.writeText(txt);
    bandeau('Résumé copié dans le presse-papiers.');
  }catch(e){
    const a=document.createElement('textarea');
    a.value=txt; a.setAttribute('aria-label','Résumé de la partie à copier');
    document.body.appendChild(a); a.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
    if(ok){ a.remove(); bandeau('Résumé copié dans le presse-papiers.'); }
    else { a.style.cssText='position:fixed;inset:8% 8% auto;height:40vh;z-index:99';
           bandeau('Copie automatique impossible : le résumé reste affiché, sélectionnez-le et copiez-le.'); }
  }
}

document.getElementById('btnTheme').addEventListener('click',()=>{
  const clair=document.body.classList.toggle('clair');
  try{ localStorage.setItem(KT, clair?'clair':'sombre'); }catch(e){}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content=clair?'#f7f7fb':'#12141c';
});
