<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>Score Pad</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#12141c; --panel:#1b1e29; --panel2:#232735; --line:#2f3546;
  --txt:#eef1f8; --dim:#9aa3b8; --accent:#f5b31c; --accent2:#ffd45e;
  --win:#3ddc84; --lose:#ff6b6b; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1d2233 0%,var(--bg) 60%);
  color:var(--txt); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
header .sub{font-size:12px;color:var(--dim);font-weight:500}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#20180a;border-color:#c99612}
.btn.ghost{background:transparent}
.btn.danger{color:var(--lose);border-color:#4a2b32}
main{flex:1;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--dim);font-size:13px}
.hidden{display:none!important}
input[type=text],input[type=number],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:12px;color:var(--txt);font-size:16px;outline:none
}
input:focus,select:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--dim);display:block;margin:0 0 6px 2px;text-transform:uppercase;letter-spacing:.6px}
/* liste des parties */
.game{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
.game .meta{flex:1;min-width:0}
.game .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
/* grille de score */
.gridwrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center;font-size:14px}
thead th{position:sticky;top:0;background:var(--panel);z-index:2;padding:8px 6px;border-bottom:1px solid var(--line);font-weight:700}
thead th .pill{font-size:10px;color:var(--dim);display:block;font-weight:600}
tbody th{padding:6px 10px;color:var(--dim);font-weight:600;background:var(--panel);position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
td.cell{min-width:64px}
td.cell button{
  display:block;width:100%;padding:12px 6px;font-size:16px;font-weight:700;
  border-bottom:1px solid rgba(255,255,255,.04)
}
td.cell button:active{background:var(--panel2)}
td.cell button.empty{color:#4c5568;font-weight:600}
tfoot td,tfoot th{background:var(--panel2);font-weight:800;font-size:16px;padding:12px 6px;border-top:1px solid var(--line)}
tfoot th{position:sticky;left:0;background:var(--panel2);color:var(--txt)}
.tot.win{color:var(--win)}
.tot.lose{color:var(--txt)}
/* pavé numérique */
.sheet{position:fixed;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:flex-end;z-index:50;backdrop-filter:blur(3px)}
.sheet .inner{width:100%;max-width:820px;margin:0 auto;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .who{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sheet .who .name{font-weight:800;font-size:17px}
.disp{font-size:40px;font-weight:800;text-align:center;padding:6px 0 12px;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 0;font-size:20px;font-weight:700}
.keys button.wide{grid-column:span 3;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#20180a;border-color:#c99612}
.keys button.soft{color:var(--lose)}
.hint{font-size:12px;color:var(--dim);text-align:center;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.chip button{color:var(--dim);font-size:15px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:11px 8px;font-size:14px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--accent);color:#20180a}
.empty-state{text-align:center;color:var(--dim);padding:26px 10px}
footer{padding:10px 16px 18px;text-align:center;color:#59617a;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Score&nbsp;Pad<span class="sub" id="hdrSub"></span></h1>
  <button class="btn ghost" id="btnTheme" title="Thème">◐</button>
</header>
<main id="app"></main>
<footer>Vos parties restent sur cet appareil · aucune inscription</footer>
<div id="sheetHost"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 * Score Pad — reconstruction web. Modèle de données :
 * data = { games:[ {id, nom, mode:'standard'|'sommeNulle', gagne:'haut'|'bas',
 *                   joueurs:[{id,nom,emoji,couleur}],
 *                   tours:[[nbr,...]], maj:timestamp } ], version:1 }
 * ------------------------------------------------------------------ */
const EMOJIS=['🙂','😀','🦊','🐻','🐼','🦁','🐸','🐵','🐧','🦄','🚀','⭐','🎲','🃏','🏆','🍀'];
const COULEURS=['#f5b31c','#3ddc84','#5aa9ff','#c084fc','#ff8a65','#4dd0e1','#f06292','#aed581'];
const K='scorepad.v1';
let data=load(), vue={ecran:'liste', id:null, saisie:null};

function load(){
  try{ const d=JSON.parse(localStorage.getItem(K)); if(d&&Array.isArray(d.games)) return d; }catch(e){}
  return {games:[],version:1};
}
function save(){ localStorage.setItem(K, JSON.stringify(data)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function jeu(){ return data.games.find(g=>g.id===vue.id); }
function total(g,j){ return g.tours.reduce((s,t)=>s+(Number(t[j])||0),0); }
function totaux(g){ return g.joueurs.map((_,j)=>total(g,j)); }
function gagnant(g){
  const t=totaux(g); if(!t.length) return -1;
  const max=g.gagne!=='bas'; let best=t[0], idx=0;
  t.forEach((v,i)=>{ if(max? v>best : v<best){best=v;idx=i;} });
  return idx;
}
function fmt(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR'); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* --------------------------- rendu --------------------------- */
function render(){
  const app=document.getElementById('app');
  document.getElementById('hdrSub').textContent = vue.ecran==='jeu'&&jeu()? ' · '+esc(jeu().nom) : '';
  app.innerHTML = vue.ecran==='liste'? vueListe() : vue.ecran==='nouvelle'? vueNouvelle() : vueJeu();
  brancher();
}
function vueListe(){
  const gs=[...data.games].sort((a,b)=>b.maj-a.maj);
  return `
  <div class="row between">
    <div class="muted">${gs.length} partie${gs.length>1?'s':''} enregistrée${gs.length>1?'s':''}</div>
    <button class="btn primary" data-act="nouvelle">+ Nouvelle partie</button>
  </div>
  ${gs.length? gs.map(g=>{
    const w=gagnant(g), t=totaux(g);
    return `<div class="game" data-open="${g.id}">
      <div class="avatar" style="background:${COULEURS[0]}22;color:${COULEURS[0]}">🎲</div>
      <div class="meta">
        <div class="title">${esc(g.nom)}</div>
        <div class="muted">${g.joueurs.length} joueurs · ${g.tours.length} tour${g.tours.length>1?'s':''}${w>=0?' · 🏆 '+esc(g.joueurs[w].nom)+' '+fmt(t[w]):''}</div>
      </div>
      <button class="btn ghost" data-del="${g.id}" title="Supprimer">✕</button>
    </div>`;}).join('')
    : `<div class="card empty-state">Aucune partie pour l'instant.<br>Créez-en une : un nom, des joueurs, et c'est parti.</div>`}`;
}
function vueNouvelle(){
  const st=vue.form;
  return `
  <div class="card">
    <label>Nom de la partie</label>
    <input type="text" id="fNom" placeholder="Rummy du vendredi" value="${esc(st.nom||'')}" autocomplete="off">
  </div>
  <div class="card">
    <label>Joueurs (${st.joueurs.length})</label>
    <div class="chips" id="chips">${st.joueurs.map((j,i)=>`
      <span class="chip"><span>${j.emoji}</span>${esc(j.nom)}<button data-delj="${i}">✕</button></span>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="fJoueur" placeholder="Prénom du joueur" style="flex:1" value="${esc(st.joueur||'')}" autocomplete="off">
      <button class="btn" data-act="addj">Ajouter</button>
    </div>
  </div>
  <div class="card">
    <label>Mode de calcul</label>
    <div class="seg" id="segMode">
      <button data-mode="standard" class="${st.mode==='standard'?'on':''}">Standard</button>
      <button data-mode="sommeNulle" class="${st.mode==='sommeNulle'?'on':''}">Somme nulle</button>
    </div>
    <div class="muted" style="margin:10px 2px 0">${st.mode==='sommeNulle'
      ? 'Chaque tour doit totaliser zéro (Tarot, contrats). Les points se répartissent entre les joueurs.'
      : 'Chaque joueur marque ses points librement.'}</div>
  </div>
  <div class="card">
    <label>La victoire revient au score</label>
    <div class="seg" id="segGagne">
      <button data-gagne="haut" class="${st.gagne==='haut'?'on':''}">Le plus haut</button>
      <button data-gagne="bas" class="${st.gagne==='bas'?'on':''}">Le plus bas</button>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn ghost" data-act="retour">Annuler</button>
    <button class="btn primary" data-act="creer" style="flex:1">Créer la partie</button>
  </div>`;
}
function vueJeu(){
  const g=jeu(); if(!g){ vue.ecran='liste'; return vueListe(); }
  const t=totaux(g), w=gagnant(g);
  const entete=`<thead><tr><th>Tour</th>${g.joueurs.map(j=>`<th>${j.emoji}<span class="pill">${esc(j.nom)}</span></th>`).join('')}</tr></thead>`;
  const corps=g.tours.map((tour,ti)=>`<tr><th>${ti+1}</th>${g.joueurs.map((_,ji)=>{
    const v=tour[ji]; const vide=(v===null||v===undefined||v==='');
    return `<td class="cell"><button class="${vide?'empty':''}" data-cell="${ti}:${ji}">${vide?'·':fmt(v)}</button></td>`;}).join('')}</tr>`).join('');
  const pied=`<tfoot><tr><th>Total</th>${t.map((v,i)=>`<td class="tot ${i===w?'win':'lose'}">${fmt(v)}</td>`).join('')}</tr></tfoot>`;
  return `
  <div class="row between">
    <button class="btn ghost" data-act="retour">‹ Parties</button>
    <button class="btn ghost" data-act="export">Exporter</button>
  </div>
  <div class="gridwrap"><table>${entete}<tbody>${corps||''}</tbody>${pied}</table></div>
  ${g.tours.length?'':`<div class="card empty-state">Aucun tour. Ajoutez-en un pour commencer à marquer.</div>`}
  <div class="row" style="gap:10px">
    <button class="btn primary" data-act="addtour" style="flex:1">+ Ajouter un tour</button>
    <button class="btn danger" data-act="delder" ${g.tours.length?'':'disabled'}>Annuler le dernier</button>
  </div>
  <div class="muted">Appuyez sur une case pour saisir ou corriger un score. Victoire au score le ${g.gagne==='bas'?'plus bas':'plus haut'} · mode ${g.mode==='sommeNulle'?'somme nulle':'standard'}.</div>`;
}
function feuilleSaisie(){
  const s=vue.saisie; if(!s) return '';
  const g=jeu(); const j=g.joueurs[s.j];
  return `<div class="sheet" data-sheet="1"><div class="inner">
    <div class="who"><span class="name">${j.emoji} ${esc(j.nom)}</span><span class="muted">Tour ${s.t+1}</span></div>
    <div class="disp">${s.val===''?'0':esc(s.val)}</div>
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}
      <button data-key="±">±</button><button data-key="0">0</button><button data-key="←">←</button>
      <button class="soft" data-key="vide">Effacer</button>
      <button data-key=".">.</button>
      <button class="wide" data-key="ok">Valider</button>
    </div>
    <div class="hint">${g.mode==='sommeNulle'?'Somme nulle : vérifiez que le tour totalise zéro.':'Montant négatif autorisé avec ±'}</div>
  </div></div>`;
}
function brancher(){
  const app=document.getElementById('app');
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{
    if(e.target.dataset.del) return; vue={ecran:'jeu',id:b.dataset.open,saisie:null}; render();});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
    const id=b.dataset.del; if(confirm('Supprimer cette partie ?')){
      data.games=data.games.filter(g=>g.id!==id); save(); render();}});
  const q=s=>app.querySelector(s);
  q('[data-act="nouvelle"]')?.addEventListener('click',()=>{
    vue={ecran:'nouvelle',id:null,saisie:null,form:{nom:'',mode:'standard',gagne:'haut',joueurs:[]}}; render();
    q('#fJoueur')?.focus();});
  q('[data-act="retour"]')?.addEventListener('click',()=>{vue={ecran:'liste',id:null,saisie:null}; render();});
  q('#fNom')?.addEventListener('input',e=>{ vue.form.nom=e.target.value; });
  q('#fJoueur')?.addEventListener('input',e=>{ vue.form.joueur=e.target.value; });
  q('[data-act="addj"]')?.addEventListener('click',()=>{
    const i=q('#fJoueur'); const nom=(i.value||'').trim(); if(!nom) {i.focus();return;}
    const n=vue.form.joueurs.length;
    vue.form.joueurs.push({id:uid(),nom,emoji:EMOJIS[n%EMOJIS.length],couleur:COULEURS[n%COULEURS.length]});
    vue.form.joueur=''; render(); q('#fJoueur').focus();});
  q('#fJoueur')?.addEventListener('keydown',e=>{ if(e.key==='Enter') q('[data-act="addj"]').click(); });
  app.querySelectorAll('[data-delj]').forEach(b=>b.onclick=()=>{
    vue.form.joueurs.splice(+b.dataset.delj,1); render();});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{vue.form.mode=b.dataset.mode; render();});
  app.querySelectorAll('[data-gagne]').forEach(b=>b.onclick=()=>{vue.form.gagne=b.dataset.gagne; render();});
  q('[data-act="creer"]')?.addEventListener('click',()=>{
    const nom=(q('#fNom')?.value||'').trim()||'Partie sans nom';
    if(vue.form.joueurs.length<2) return alert('Il faut au moins deux joueurs.');
    const g={id:uid(),nom,mode:vue.form.mode,gagne:vue.form.gagne,
             joueurs:vue.form.joueurs,tours:[[]],maj:Date.now()};
    g.tours[0]=g.joueurs.map(()=>null);
    data.games.push(g); save(); vue={ecran:'jeu',id:g.id,saisie:null}; render();});
  q('[data-act="addtour"]')?.addEventListener('click',()=>{
    const g=jeu(); g.tours.push(g.joueurs.map(()=>null)); g.maj=Date.now(); save(); render();});
  q('[data-act="delder"]')?.addEventListener('click',()=>{
    const g=jeu(); if(g.tours.length){ g.tours.pop(); g.maj=Date.now(); save(); render();}});
  q('[data-act="export"]')?.addEventListener('click',()=>exporter(jeu()));
  app.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{
    const [t,j]=b.dataset.cell.split(':').map(Number);
    const v=jeu().tours[t][j];
    vue.saisie={t,j,val:(v===null||v===undefined)?'':String(v),frais:(v!==null&&v!==undefined&&String(v)!=='')};
    document.getElementById('sheetHost').innerHTML=feuilleSaisie(); brancherFeuille();});
}
function brancherFeuille(){
  const host=document.getElementById('sheetHost');
  host.querySelector('[data-sheet]')?.addEventListener('click',e=>{
    if(e.target.dataset.sheet){ host.innerHTML=''; vue.saisie=null; }});
  host.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.key, s=vue.saisie;
    if(k==='ok'){ validerSaisie(); return; }
    if(k==='vide'){ s.val=''; s.frais=false; }
    else if(k==='←'){ s.val=s.val.slice(0,-1); s.frais=false; }
    else if(k==='±'){ s.val = s.val.startsWith('-')? s.val.slice(1) : '-'+(s.val||'0'); s.frais=false; }
    else if(k==='.'){ if(!s.val.includes('.')) s.val=(s.val||'0')+'.'; }
    else { if(s.frais){ s.val=''; s.frais=false; } s.val = (s.val==='0'?'':s.val)+k; }
    host.innerHTML=feuilleSaisie(); brancherFeuille();});
}
function validerSaisie(){
  const s=vue.saisie, g=jeu();
  const brut=s.val.trim();
  let v = brut===''||brut==='-'? null : Number(brut.replace(',','.'));
  if(v!==null && !isFinite(v)) v=null;
  // somme nulle : contrôle souple — on prévient sans bloquer
  const avant = g.tours[s.t].reduce((a,x)=>a+(Number(x)||0),0);
  g.tours[s.t][s.j]=v;
  const apres = g.tours[s.t].reduce((a,x)=>a+(Number(x)||0),0);
  if(g.mode==='sommeNulle' && g.tours[s.t].every(x=>x!==null) && apres!==0){
    if(!confirm('Ce tour totalise '+fmt(apres)+' au lieu de 0 (somme nulle). Enregistrer quand même ?')){
      g.tours[s.t][s.j]= (avant-((Number(g.tours[s.t][s.j])||0)))?null:null; // restaure null
      g.tours[s.t][s.j]=null;
    }
  }
  g.maj=Date.now(); save();
  document.getElementById('sheetHost').innerHTML=''; vue.saisie=null; render();
}
function exporter(g){
  const t=totaux(g), w=gagnant(g);
  let txt='Score Pad — '+g.nom+'\n';
  txt+='Victoire au score le '+(g.gagne==='bas'?'plus bas':'plus haut')+' · '+(g.mode==='sommeNulle'?'somme nulle':'standard')+'\n\n';
  txt+='Tour\t'+g.joueurs.map(j=>j.nom).join('\t')+'\n';
  g.tours.forEach((tr,i)=>{ txt+=(i+1)+'\t'+g.joueurs.map((_,j)=>tr[j]===null?'-':fmt(tr[j])).join('\t')+'\n'; });
  txt+='TOTAL\t'+t.map(fmt).join('\t')+'\n';
  if(w>=0) txt+='\n🏆 '+g.joueurs[w].nom+' — '+fmt(t[w])+'\n';
  if(navigator.share){ navigator.share({title:g.nom,text:txt}).catch(()=>{}); }
  else { navigator.clipboard?.writeText(txt); alert('Résumé copié dans le presse-papiers.'); }
}
document.getElementById('btnTheme').onclick=()=>{
  const b=document.body; const sombre=b.style.getPropertyValue('--bg')==='#f7f7fb';
  if(sombre){ ['--bg','--panel','--panel2','--line','--txt','--dim'].forEach((k,i)=>b.style.removeProperty(k)); }
  else { b.style.setProperty('--bg','#f7f7fb'); b.style.setProperty('--panel','#ffffff'); b.style.setProperty('--panel2','#eef0f6');
         b.style.setProperty('--line','#dde1ec'); b.style.setProperty('--txt','#161a22'); b.style.setProperty('--dim','#5d677d'); }
};
render();
</script>
</body>
</html>
